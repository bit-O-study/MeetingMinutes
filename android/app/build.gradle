apply plugin: 'com.android.application'
android {
    namespace 'kr.bito.projectmemo'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.bito.projectmemo'
        minSdk 26
        targetSdk 36
        versionCode (System.getenv('APK_VERSION_CODE') ?: '6').toInteger()
        versionName (System.getenv('APK_VERSION_NAME') ?: '1.0.5')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
